services:
  base-project-pg:
    image: postgres:16.2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-handyDB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      HANDYNEST_STORAGE_PUBLIC_BUCKET: ${HANDYNEST_STORAGE_PUBLIC_BUCKET:-handynest-public}
      HANDYNEST_STORAGE_PARTICIPANTS_BUCKET: ${HANDYNEST_STORAGE_PARTICIPANTS_BUCKET:-handynest-private}
      HANDYNEST_STORAGE_VERIFICATION_BUCKET: ${HANDYNEST_STORAGE_VERIFICATION_BUCKET:-handynest-verification}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb -p "local/$${HANDYNEST_STORAGE_PUBLIC_BUCKET}" || true
        mc mb -p "local/$${HANDYNEST_STORAGE_PARTICIPANTS_BUCKET}" || true
        mc mb -p "local/$${HANDYNEST_STORAGE_VERIFICATION_BUCKET}" || true

volumes:
  minio-data:
