spring:
  application:
    name: handyNestProject
  profiles:
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

springdoc:
  packages-to-scan:
    - com.handynest
  paths-to-match:
    - /api/v1/**
  swagger-ui:
    path: /swagger-ui-custom.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-} correlationId:%X{correlationId:-}]"

jwttoken:
  signing:
    key: ${HANDYNEST_JWT_SIGNING_KEY}

app:
  idempotency:
    request-ttl: ${HANDYNEST_IDEMPOTENCY_REQUEST_TTL:24h}
    cleanup-interval: ${HANDYNEST_IDEMPOTENCY_CLEANUP_INTERVAL:1h}
  data-retention:
    cleanup-interval: ${HANDYNEST_DATA_RETENTION_CLEANUP_INTERVAL:24h}
    batch-size: ${HANDYNEST_DATA_RETENTION_BATCH_SIZE:100}
    verification-document-retention-days: ${HANDYNEST_VERIFICATION_DOCUMENT_RETENTION_DAYS:90}
    deleted-user-anonymization-days: ${HANDYNEST_DELETED_USER_ANONYMIZATION_DAYS:30}
    chat-retention-days: ${HANDYNEST_CHAT_RETENTION_DAYS:1095}
    audit-log-retention-days: ${HANDYNEST_AUDIT_LOG_RETENTION_DAYS:1825}
    attachment-retention-days: ${HANDYNEST_ATTACHMENT_RETENTION_DAYS:365}
  payment:
    webhook-token: ${HANDYNEST_PAYMENT_WEBHOOK_TOKEN:}
  notifications:
    outbox-worker:
      fixed-delay: ${HANDYNEST_OUTBOX_WORKER_FIXED_DELAY:10s}
      batch-size: ${HANDYNEST_OUTBOX_WORKER_BATCH_SIZE:50}
  storage:
    default-provider: ${HANDYNEST_STORAGE_PROVIDER:MINIO}
    public-bucket: ${HANDYNEST_STORAGE_PUBLIC_BUCKET:handynest-public}
    participants-bucket: ${HANDYNEST_STORAGE_PARTICIPANTS_BUCKET:handynest-private}
    verification-bucket: ${HANDYNEST_STORAGE_VERIFICATION_BUCKET:handynest-verification}
    endpoint: ${HANDYNEST_STORAGE_ENDPOINT:http://localhost:${MINIO_API_PORT:9000}}
    region: ${HANDYNEST_STORAGE_REGION:us-east-1}
    access-key: ${HANDYNEST_STORAGE_ACCESS_KEY:${MINIO_ROOT_USER:}}
    secret-key: ${HANDYNEST_STORAGE_SECRET_KEY:${MINIO_ROOT_PASSWORD:}}
    path-style-access: ${HANDYNEST_STORAGE_PATH_STYLE_ACCESS:true}
    presigned-enabled: ${HANDYNEST_STORAGE_PRESIGNED_ENABLED:true}
    upload-url-ttl: ${HANDYNEST_STORAGE_UPLOAD_URL_TTL:10m}
    download-url-ttl: ${HANDYNEST_STORAGE_DOWNLOAD_URL_TTL:5m}
  security:
    jwt:
      access-token-ttl: ${HANDYNEST_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${HANDYNEST_REFRESH_TOKEN_TTL:30d}
    refresh-cookie:
      name: ${HANDYNEST_REFRESH_COOKIE_NAME:handynest_refresh_token}
      path: ${HANDYNEST_REFRESH_COOKIE_PATH:/api/v1/auth}
      same-site: ${HANDYNEST_REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${HANDYNEST_REFRESH_COOKIE_SECURE:false}
    rate-limit:
      enabled: ${HANDYNEST_RATE_LIMIT_ENABLED:true}
      cleanup-interval: ${HANDYNEST_RATE_LIMIT_CLEANUP_INTERVAL:10m}
      idle-entry-ttl: ${HANDYNEST_RATE_LIMIT_IDLE_ENTRY_TTL:2h}
      register:
        capacity: ${HANDYNEST_RATE_LIMIT_REGISTER_CAPACITY:3}
        window: ${HANDYNEST_RATE_LIMIT_REGISTER_WINDOW:1h}
      login:
        capacity: ${HANDYNEST_RATE_LIMIT_LOGIN_CAPACITY:5}
        window: ${HANDYNEST_RATE_LIMIT_LOGIN_WINDOW:10m}
      refresh:
        capacity: ${HANDYNEST_RATE_LIMIT_REFRESH_CAPACITY:60}
        window: ${HANDYNEST_RATE_LIMIT_REFRESH_WINDOW:1m}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:handyDB}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
